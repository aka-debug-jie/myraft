<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MyRaft · 共识观测台</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <svg aria-hidden="true" style="display:none"><defs>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-log" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 10-13h-7z"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 3v17h17M8 15V9m5 6V5m5 10v-4"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 4-5 8-8 10-3-2-8-6-8-10V6zM8 12l3 3 5-6"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h6m4 0h6M4 12h10m4 0h2M4 18h3m4 0h9"/><circle cx="12" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5.5 8a7 7 0 0 1 12-3l2.5 3M4 16l2.5 3a7 7 0 0 0 12-3"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15A8 8 0 0 1 9 4a8.5 8.5 0 1 0 11 11Z"/></symbol>
<symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
</defs></svg>
  <aside class="sidebar" id="sidebar" aria-label="侧边栏">
    <div class="brand">
      <div class="brandmark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div>MyRaft<small>CONSENSUS OBSERVATORY</small></div>
    </div>
    <div class="workspace" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <div><strong id="session-name">尚未连接</strong><div class="muted small" id="session-meta">正在加载</div></div>
    </div>
    <div class="navlabel">工作区</div>
    <nav class="nav" id="nav" aria-label="主导航">
      <button class="active" type="button" data-view="overview"><svg class="ico" aria-hidden="true"><use href="#i-grid"></use></svg>集群概览</button>
      <button type="button" data-view="nodes"><svg class="ico" aria-hidden="true"><use href="#i-log"></use></svg>节点</button>
      <button type="button" data-view="consensus"><svg class="ico" aria-hidden="true"><use href="#i-bolt"></use></svg>共识状态</button>
      <button type="button" data-view="metrics"><svg class="ico" aria-hidden="true"><use href="#i-chart"></use></svg>运行指标</button>
      <button type="button" data-view="settings"><svg class="ico" aria-hidden="true"><use href="#i-sliders"></use></svg>设置</button>
    </nav>
    <div class="sidebottom">
      <span class="reviewtag mono">REAL · 本地节点</span>
      <p><strong>本地 Raft 集群</strong></p>
      <p>等待连接；当前没有节点数据</p>
    </div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <button class="iconbtn mobilebtn" type="button" data-act="menu" aria-label="打开导航"><svg class="ico" aria-hidden="true"><use href="#i-menu"></use></svg></button>
      <div class="breadcrumbs" id="crumb" aria-label="当前位置">MyRaft <b>集群概览</b></div>
      <div class="topspacer"></div>
      <div class="search"><svg class="ico" aria-hidden="true"><use href="#i-search"></use></svg><input id="search" type="search" aria-label="搜索节点 ID" placeholder="搜索节点"></div>
      <span class="tag connection-state"><span class="dot" aria-hidden="true"></span><span id="connection">连接中</span></span>
      <span class="tag">模式 <strong id="mode">只读</strong></span>
      <button class="iconbtn" type="button" data-act="theme" aria-label="切换明暗主题"><svg class="ico" aria-hidden="true"><use href="#i-moon"></use></svg></button>
      <button class="iconbtn" type="button" data-act="present" aria-label="切换演示模式"><svg class="ico" aria-hidden="true"><use href="#i-expand"></use></svg></button>
    </header>
    <main id="main" tabindex="-1">
      <section class="intro" aria-labelledby="page-title">
        <div><div class="eyebrow">本地集群</div><h1 id="page-title">共识观测台</h1><p>查看本地 Raft 节点与集群状态。</p></div>
      </section>
      <section class="panel" aria-label="集群状态">
        <div class="loading-state" role="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span>正在读取本地集群状态…</span>
        </div>
      </section>
    </main>
  </div>
  <div id="overlay" aria-hidden="true"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</body>
</html>
