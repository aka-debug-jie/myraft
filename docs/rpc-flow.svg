<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Raft RPC and persistence flows</title>
  <desc id="desc">Election and client write replication flows, including durable storage points and network RPC outside locks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#425466"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
      .title { font-size: 25px; font-weight: 700; }
      .section { font-size: 18px; font-weight: 700; }
      .node { fill: #ffffff; stroke: #7890a8; stroke-width: 1.5; rx: 10; }
      .durable { fill: #eaf3ff; stroke: #3973ac; stroke-width: 1.7; rx: 10; }
      .rpc { fill: #fff4db; stroke: #c28a20; stroke-width: 1.7; rx: 10; }
      .apply { fill: #e8f6ee; stroke: #3c8c5a; stroke-width: 1.7; rx: 10; }
      .label { font-size: 14px; font-weight: 600; text-anchor: middle; }
      .small { font-size: 12px; fill: #526579; text-anchor: middle; }
      .arrow { fill: none; stroke: #425466; stroke-width: 2; marker-end: url(#arrow); }
      .note { font-size: 13px; fill: #7a5713; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="790" fill="#f7f9fc"/>
  <text x="40" y="42" class="title">Raft RPC and Durable State Flows</text>

  <rect x="28" y="62" width="1144" height="240" rx="16" fill="#eef4fa" stroke="#d4dfeb"/>
  <text x="50" y="92" class="section">1. Leader Election</text>
  <text x="530" y="128" class="note" text-anchor="middle">Network RPC runs outside locks</text>

  <rect x="50" y="154" width="150" height="66" class="node"/>
  <text x="125" y="180" class="label"><tspan x="125">Election</tspan><tspan x="125" dy="18">timeout</tspan></text>
  <rect x="230" y="154" width="150" height="66" class="durable"/>
  <text x="305" y="180" class="label"><tspan x="305">Persist term</tspan><tspan x="305" dy="18">and vote</tspan></text>
  <rect x="415" y="154" width="135" height="66" class="rpc"/>
  <text x="482" y="181" class="label"><tspan x="482">RequestVote</tspan><tspan x="482" dy="18">RPC</tspan></text>
  <rect x="585" y="154" width="150" height="66" class="node"/>
  <text x="660" y="176" class="label"><tspan x="660">Follower freshness</tspan><tspan x="660" dy="17">check + durable</tspan><tspan x="660" dy="17">vote</tspan></text>
  <rect x="790" y="154" width="135" height="66" class="node"/>
  <text x="857" y="180" class="label"><tspan x="857">Majority</tspan><tspan x="857" dy="18">votes</tspan></text>
  <rect x="980" y="154" width="160" height="66" class="apply"/>
  <text x="1060" y="176" class="label"><tspan x="1060">Append current-term</tspan><tspan x="1060" dy="18">no-op</tspan></text>
  <path d="M200 187 H228" class="arrow"/><path d="M380 187 H413" class="arrow"/>
  <path d="M550 187 H583" class="arrow"/><path d="M735 187 H788" class="arrow"/>
  <path d="M925 187 H978" class="arrow"/>
  <text x="600" y="283" class="small">Current-term no-op is committed only after majority replication.</text>

  <rect x="28" y="320" width="1144" height="440" rx="16" fill="#eef4fa" stroke="#d4dfeb"/>
  <text x="50" y="350" class="section">2. Client Write and Replication</text>
  <text x="513" y="390" class="note" text-anchor="middle">Network RPC runs outside locks</text>

  <rect x="50" y="410" width="135" height="72" class="node"/>
  <text x="117" y="438" class="label"><tspan x="117">CLI</tspan><tspan x="117" dy="19">Generate</tspan></text>
  <rect x="225" y="410" width="145" height="72" class="durable"/>
  <text x="297" y="438" class="label"><tspan x="297">Leader WAL</tspan><tspan x="297" dy="19">Sync</tspan></text>
  <rect x="410" y="410" width="170" height="72" class="rpc"/>
  <text x="495" y="435" class="label"><tspan x="495">AppendEntries</tspan><tspan x="495" dy="18">128-entry batches</tspan></text>
  <rect x="620" y="410" width="180" height="72" class="durable"/>
  <text x="710" y="430" class="label"><tspan x="710">Follower prefix check</tspan><tspan x="710" dy="17">then log WAL Sync</tspan></text>
  <path d="M185 446 H223" class="arrow"/><path d="M370 446 H408" class="arrow"/><path d="M580 446 H618" class="arrow"/>

  <rect x="850" y="410" width="120" height="72" class="rpc"/>
  <text x="910" y="450" class="label">Reply</text>
  <rect x="1000" y="410" width="145" height="72" class="node"/>
  <text x="1072" y="435" class="label"><tspan x="1072">Leader current-</tspan><tspan x="1072" dy="18">term majority</tspan></text>
  <path d="M800 446 H848" class="arrow"/><path d="M970 446 H998" class="arrow"/>

  <rect x="850" y="565" width="150" height="76" class="durable"/>
  <text x="925" y="590" class="label"><tspan x="925">Save commit</tspan><tspan x="925" dy="18">index</tspan></text>
  <rect x="1030" y="565" width="115" height="76" class="apply"/>
  <text x="1087" y="609" class="label">Apply x</text>
  <path d="M1072 482 V535 H925 V563" class="arrow"/><path d="M1000 603 H1028" class="arrow"/>

  <rect x="440" y="565" width="300" height="76" class="rpc"/>
  <text x="590" y="591" class="label"><tspan x="590">Next AppendEntries carries</tspan><tspan x="590" dy="19">LeaderCommit</tspan></text>
  <path d="M1087 641 V665 H790 V603 H742" class="arrow"/>
  <rect x="70" y="565" width="310" height="76" class="durable"/>
  <text x="225" y="589" class="label"><tspan x="225">Follower saves commit index</tspan><tspan x="225" dy="19">and applies x</tspan></text>
  <path d="M440 603 H382" class="arrow"/>
  <text x="600" y="700" class="small">Runtime logs are written to both the terminal and a file.</text>
  <text x="600" y="726" class="small">Blue: durable state  ·  Amber: RPC  ·  Green: apply / leadership action</text>
</svg>
